{% extends "base.html" %}
{% block title %}{{ "Edit" if product else "New" }} product — Admin{% endblock %}
{% block content %}
<div class="wrap admin-shell">
  {% include "admin/_sidebar.html" %}
  <div>
    <h1>{{ "Edit product" if product else "New product" }}</h1>
    <form class="form-card" style="margin:24px 0 0; max-width:560px;"
          method="post" action="{{ '/admin/products/' ~ product.id ~ '/edit' if product else '/admin/products/new' }}">
      <div class="field"><label>Name</label><input type="text" name="name" value="{{ product.name if product else '' }}" required></div>
      <div class="field"><label>Description</label><textarea name="description">{{ product.description if product else '' }}</textarea></div>
      <div class="field"><label>Price ($)</label><input type="number" step="0.01" name="price" value="{{ product.price if product else '' }}" required></div>
      <div class="field"><label>Stock quantity</label><input type="number" name="stock_quantity" value="{{ product.stock_quantity if product else 0 }}" required></div>
      <div class="field"><label>Material</label><input type="text" name="material" value="{{ product.material if product else '' }}"></div>
      <div class="field"><label>Dimensions</label><input type="text" name="dimensions" value="{{ product.dimensions if product else '' }}"></div>
      <div class="field"><label>Image URL</label><input type="text" name="image_url" value="{{ product.image_url if product else '' }}"></div>
      <div class="field">
        <label>Category</label>
        <select name="category_id" required>
          <option value="">Select a category</option>
          {% for c in categories %}
          <option value="{{ c.id }}" {% if product and product.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>
          {% endfor %}
        </select>
      </div>
      {% if product %}
      <div class="field" style="display:flex; align-items:center; gap:8px;">
        <input type="checkbox" name="is_active" value="true" style="width:auto;" {% if product.is_active %}checked{% endif %}>
        <label style="margin:0;">Visible in showroom</label>
      </div>
      {% endif %}
      <button class="btn btn-primary btn-block" type="submit">{{ "Save changes" if product else "Create product" }}</button>
    </form>
  </div>
</div>
{% endblock %}
