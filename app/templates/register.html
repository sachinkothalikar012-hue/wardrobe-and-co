{% extends "base.html" %}
{% block title %}Create account — Wardrobe & Co.{% endblock %}
{% block content %}
<div class="form-card">
  <h2>Create your account</h2>
  {% if error %}<div class="form-error">{{ error }}</div>{% endif %}
  <form method="post" action="/register">
    <div class="field"><label>Full name</label><input type="text" name="full_name" required></div>
    <div class="field"><label>Email</label><input type="email" name="email" required></div>
    <div class="field"><label>Password</label><input type="password" name="password" minlength="6" required></div>
    <button class="btn btn-primary btn-block" type="submit">Create account</button>
  </form>
  <p class="form-note">Already have an account? <a href="/login" style="text-decoration:underline;">Log in</a></p>
</div>
{% endblock %}
